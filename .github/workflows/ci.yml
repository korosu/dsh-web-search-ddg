name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: peer-range check
        run: pnpm peers check

      - name: test (offline suite)
        run: pnpm test

      - name: build and verify committed lib/ stays in sync with src/
        run: |
          pnpm build
          if ! git diff --exit-code -- lib; then
            echo "::error file=lib::committed lib/ differs from a fresh build — run 'pnpm build' and commit lib/"
            exit 1
          fi
